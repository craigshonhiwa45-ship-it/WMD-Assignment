    <h1>Luxury Nail Shop</h1>

    <button class="cart-btn" onclick="toggleCart()">
        Cart (<span id="cart-count">0</span>)
    </button>

    <div class="shop-container">

        <div class="product-card">
            <img src="71O0ApAE-OL.jpg" alt="Nail Polish">
            <h3>Pink Nail Polish</h3>
            <p class="price">P80</p>
            <button onclick="addToCart('Pink Nail Polish', 80)">
                Add to Cart
            </button>
        </div>

        <div class="product-card">
            <img src="81OY0N22XEL._AC_UF1000,1000_QL80_.jpg" alt="Nail Care Kit">
            <h3>Nail Care Kit</h3>
            <p class="price">P150</p>
            <button onclick="addToCart('Nail Care Kit', 150)">
                Add to Cart
            </button>
        </div>

        <div class="product-card">
            <img src="acrylic_nail_kit-SA0574-01.webp" alt="Acrylic Nail Set">
            <h3>Acrylic Nail Set</h3>
            <p class="price">P220</p>
            <button onclick="addToCart('Acrylic Nail Set', 220)">
                Add to Cart
            </button>
        </div>

       
    </div>

    
    <div class="cart" id="cart">

        <button class="close-cart" onclick="toggleCart()">
            Close
        </button>

        <h2>Your Cart</h2>

        <div id="cart-items"></div>

        <div class="total">
            Total: P<span id="total-price">0</span>
        </div>
